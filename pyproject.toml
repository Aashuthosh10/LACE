[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lace-engine"
version = "0.1.0"
description = "Local-first coding engine with deterministic patch validation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "prompt-toolkit>=3.0.50,<4",
  "pydantic>=2.10,<3",
  "rich>=14,<16",
  "typer>=0.15,<1",
]

[project.scripts]
lace = "lace.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lace"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = ["docker_live: controlled tests executed only through the restricted Docker backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
